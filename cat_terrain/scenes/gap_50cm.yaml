  rpy_deg: [160.0, 0.0, -90.0]
  azimuth_samples: 900
  rate_hz: 10.0
  min_range_m: 0.1
  max_range_m: 30.0
robot:
  pose_xyzyaw_deg: [0.0, 0.0, 0.0, 0.0]
  linear_speed_mps: 0.0
  yaw_rate_deg_s: 0.0
surfaces:
  - name: ground
    bounds_xy_m: [-3.0, 8.0, -4.0, 4.0]
    height_m: 0.0
    holes:
      - [1.7, 2.2, -1.0, 1.0]
boxes: []
