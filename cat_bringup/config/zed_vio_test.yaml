/**:
  ros__parameters:
    # VIO profile for normal odometry and the manual loop experiment.
    # ZED Mini VGA is 672x376 per eye. 30 fps improves tracking during turns.
    general:
      # Fail a missing/disconnected camera promptly so zed_sensors.launch.py
      # can respawn a clean wrapper after USB re-enumeration.
      camera_timeout_sec: 3
      camera_max_reconnect: 2
      grab_resolution: 'VGA'
      grab_frame_rate: 30
      pub_resolution: 'NATIVE'
      pub_frame_rate: 30.0
      grab_compute_capping_fps: 0.0
    video:
      publish_rgb: true
      publish_left_right: false
      publish_raw: false
      publish_gray: false
      publish_stereo: false
      enable_24bit_output: true
    depth:
      # GEN_1 tracking requires depth processing; avoid publishing dense outputs.
      depth_mode: 'PERFORMANCE'
      publish_depth_map: false
      publish_depth_info: false
      publish_point_cloud: false
      publish_depth_confidence: false
      publish_disparity: false
    sensors:
      # Use SDK bias-corrected gyro from data; EKF ignores orientation/acceleration.
      publish_imu: true
      publish_imu_raw: false
      publish_cam_imu_transf: false
      publish_mag: false
      publish_baro: false
      publish_temp: false
      sensors_pub_rate: 100.0
    pos_tracking:
      # Independent camera trajectory; never broadcast competing odometry TF.
      pos_tracking_enabled: true
      pos_tracking_mode: 'GEN_1'
      map_frame: zed_map
      odometry_frame: zed_odom
      imu_fusion: true
      publish_odom_pose: true
      publish_pose_cov: true
      publish_tf: false
      publish_map_tf: false
      area_memory: false
      reset_odom_with_loop_closure: false
    gnss_fusion:
      gnss_fusion_enabled: false
