ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    # Only independent velocities; do not fuse their integrated wheel pose again.
    odom0: /wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true, false, false, false, false, true,
                   false, false, false]
    odom0_queue_size: 5
    imu0: /imu/ekf
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
