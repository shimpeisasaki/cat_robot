# CAT supervisor profile; common values are expanded before wrapper launch.
cat_zed_common: zed_common.yaml
/**:
  ros__parameters:
    depth:
      depth_mode: 'NONE'
      depth_stabilization: 0
    sensors:
      # Wheel EKF consumes the SDK bias-corrected gyro.
      publish_imu: true
    pos_tracking:
      pos_tracking_enabled: false
      imu_fusion: false
      publish_odom_pose: false
      publish_pose_cov: false
      publish_cam_path: false
      publish_tf: false
      publish_map_tf: false
      area_memory: false
      reset_odom_with_loop_closure: false
