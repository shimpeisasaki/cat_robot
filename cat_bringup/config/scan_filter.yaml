sector_scan_filter:
  ros__parameters:
    # Defaults match base_link -> RPLIDAR_B; launch overrides for selected mount.
    mounting_roll: 3.141592653589793
    mounting_yaw: 1.5707963267948966
    front_angle_deg: 270.0
    # Uniform 0.2 m exclusion in every direction, measured from the LiDAR.
    front_min_range: 0.2
    rear_min_range: 0.2
