# CAT supervisor profile; common values are expanded before wrapper launch.
cat_zed_common: zed_common.yaml
/**:
  ros__parameters:
    depth:
      # GEN_1 retains internal depth, independently of ROS image publication.
      depth_mode: 'PERFORMANCE'
    sensors:
      publish_imu: false
    pos_tracking:
      pos_tracking_enabled: true
      pos_tracking_mode: 'GEN_1'
      map_frame: zed_map
      odometry_frame: zed_odom
      imu_fusion: true
      two_d_mode: false
      set_gravity_as_origin: true
      publish_odom_pose: true
      publish_pose_cov: true
      publish_cam_path: false
      publish_tf: false
      publish_map_tf: false
      area_memory: false
      reset_odom_with_loop_closure: false
