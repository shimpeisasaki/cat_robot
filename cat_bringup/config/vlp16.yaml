velodyne_driver_node:
  ros__parameters:
    device_ip: 192.168.0.201
    port: 2368
    model: VLP16
    rpm: 600.0
    frame_id: vlp16
    gps_time: false
    timestamp_first_packet: false

velodyne_transform_node:
  ros__parameters:
    model: VLP16
    min_range: 0.1
    max_range: 130.0
    fixed_frame: ""
    target_frame: ""
    organize_cloud: true

vlp16_sector_filter:
  ros__parameters:
    scan_frame: vlp16
    # Must match the base_link -> vlp16 joint orientation in the URDF.
    mounting_roll: 0.0
    mounting_pitch: 0.12217304763960307
    mounting_yaw: 0.0
    front_angle_deg: 270.0
    front_min_range: 0.1
    rear_min_range: 0.6
