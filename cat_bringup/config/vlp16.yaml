velodyne_driver_node:
  ros__parameters:
    device_ip: 192.168.0.201
    port: 2368
    model: VLP16
    rpm: 600.0
    frame_id: VLP16_B
    gps_time: false
    timestamp_first_packet: false

velodyne_transform_node:
  ros__parameters:
    model: VLP16
    min_range: 0.1
    max_range: 130.0
    fixed_frame: ""
    target_frame: ""
    organize_cloud: true

vlp16_sector_filter:
  ros__parameters:
    scan_frame: VLP16_B
    # Must match the selected base_link -> VLP16_F/B joint in the URDF.
    mounting_roll: 2.792526803190927
    mounting_pitch: 0.0
    mounting_yaw: -1.5707963267948966
    front_angle_deg: 270.0
    front_min_range: 0.1
    rear_min_range: 0.6

vlp16_power_manager:
  ros__parameters:
    device_ip: 192.168.0.201
    startup_rpm: 600
    request_timeout: 1.5
    status_timeout: 8.0
