# Manual curvature-drive and Nav2 velocity-smoother parameters.
# Right stick: vertical = linear speed, horizontal = path curvature.
curvature_teleop:
  ros__parameters:
    update_period: 0.033333
    joystick_timeout: 0.5
    joystick_deadzone: 0.02
    curvature_deadzone: 0.03
    normal_max_linear_speed: 1.0      # m/s
    high_max_linear_speed: 1.666667   # 6 km/h
    maximum_curvature: 1.1            # 1/m; minimum nominal turn radius is 0.91 m

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 30.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [1.666667, 0.0, 1.0]
    min_velocity: [-1.666667, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.2]
    max_decel: [-0.8, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
