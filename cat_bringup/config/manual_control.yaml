# Manual curvature-drive and Nav2 velocity-smoother parameters.
# Right stick: vertical = linear speed, horizontal = path curvature.
curvature_teleop:
  ros__parameters:
    update_period: 0.033333
    joystick_timeout: 0.5
    joystick_deadzone: 0.02
    curvature_deadzone: 0.03
    normal_max_linear_speed: 0.9      # m/s; keeps full-steer yaw at or below 3.0 rad/s
    maximum_curvature: 3.333333       # 1/m; minimum nominal turn radius is 0.30 m

velocity_smoother_manual:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 30.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [1.666667, 0.0, 3.0]
    min_velocity: [-1.666667, 0.0, -3.0]
    max_accel: [0.5, 0.0, 1.2]
    max_decel: [-0.8, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
