emcl2:
  ros__parameters:
    odom_freq: 30
    transform_tolerance: 0.2
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    footprint_frame_id: base_link
    laser_min_range: 0.1
    laser_max_range: 40.0
    scan_increment: 1
    scan_max_age: 0.3  # seconds from first ray acquisition; reject older scans
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    num_particles: 500
    # Expansion resetting: retain upstream starting values for real-robot tuning.
    alpha_threshold: 0.5
    expansion_radius_position: 0.1
    expansion_radius_orientation: 0.2
    extraction_rate: 0.1
    range_threshold: 0.3
    # Sensor resetting is a separate feature, not the expansion reset switch.
    sensor_reset: false
    odom_fw_dev_per_fw: 0.19
    odom_fw_dev_per_rot: 0.0001
    odom_rot_dev_per_fw: 0.13
    odom_rot_dev_per_rot: 0.2
    laser_likelihood_max_dist: 0.2
